function renderServices(lang){
  const grid = document.getElementById('servicesGrid');
  grid.innerHTML = servicesData.map(s=>{
    const d = s[lang];
    const btnText = lang==='te' ? 'Click Here — వివరాలు అడగండి' : 'Click Here — Enquire Now';
    const waMsg = lang==='te' ? `నమస్కారం Jai Raj Tech Services, ${d.title} సేవ కావాలి.` : `Hi Jai Raj Tech Services, I need ${d.title} service.`;
    return `<div class="card"><div class="iconbox">${s.icon}</div><div class="num">${s.num}</div><h3>${d.title}</h3><p>${d.desc}</p><ul class="list">${d.list.map(li=>`<li>${li}</li>`).join('')}</ul><a class="btn secondary" href="https://wa.me/919505715414?text=${encodeURIComponent(waMsg)}" target="_blank" rel="noopener">${btnText}</a></div>`;
  }).join('');
}

function setLang(lang){
  localStorage.setItem('jairaj_lang', lang);
  document.documentElement.lang = lang;
  document.getElementById('btn-te').classList.toggle('active', lang==='te');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k = el.getAttribute('data-key');
    if(dict[lang][k]) el.innerHTML = dict[lang][k];
  });
  renderServices(lang);
}

document.getElementById('year').textContent = new Date().getFullYear();
setLang(localStorage.getItem('jairaj_lang') || 'te');
